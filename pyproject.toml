[project]
name = "agent-hub-api"
version = "0.1.0"
description = "Agent Hub decision-tree API: customers, projects, trees, nodes, fields, ML models."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "psycopg[binary]>=3.2",
    "ariadne>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_graphql.py" = ["E501"]  # GraphQL documents read better unwrapped
